<div class="page-hero">
  <div class="hero-content">
    <h1>Smart Claims Intake &amp; Triage</h1>
    <p>
      Select an active policy to file a new
      claim
    </p>
  </div>
</div>

<div class="section-label">
  YOUR ACTIVE POLICIES
</div>

<div class="loading" *ngIf="loading">
  Loading policies...
</div>

<div class="policy-grid"
     *ngIf="!loading">
  <div class="policy-card"
       *ngFor="let policy of policies">
    <div class="card-header">
      <span class="policy-type">
        {{ policy.policyType }}
      </span>
      <span class="policy-status active">
        ACTIVE
      </span>
    </div>
    <div class="card-body">
      <div class="policy-number">
        {{ policy.policyNumber }}
      </div>
      <div class="customer-name">
        {{ policy.customer.fullName }}
      </div>
      <div class="detail-row">
        <span class="label">Coverage</span>
        <span class="value">
          {{ policy.startDate }}
          to {{ policy.endDate }}
        </span>
      </div>
      <div class="detail-row">
        <span class="label">
          Covered Claims
        </span>
        <span class="value">
          <span class="claim-tag"
            *ngFor="let t
              of policy.coveredClaimTypes">
            {{ t }}
          </span>
        </span>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn-primary"
        (click)="startClaim(policy.id)">
        FILE NEW CLAIM
      </button>
    </div>
  </div>
</div>
