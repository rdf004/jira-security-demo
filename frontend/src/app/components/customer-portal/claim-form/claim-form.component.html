<div class="form-container"
     *ngIf="!loading">
  <div class="form-header">
    <h2>File a New Claim</h2>
    <p class="policy-info" *ngIf="policy">
      Policy: {{ policy.policyNumber }}
      ({{ policy.policyType }}) —
      {{ policy.customer.fullName }}
    </p>
  </div>

  <div class="error-box"
       *ngIf="errors.length > 0">
    <div class="error-title">
      Please fix the following:
    </div>
    <ul>
      <li *ngFor="let e of errors">
        {{ e }}
      </li>
    </ul>
  </div>

  <form (ngSubmit)="submit()"
        class="claim-form">

    <div class="form-group">
      <label class="form-label">
        CLAIM TYPE
      </label>
      <select class="form-control"
        [(ngModel)]="claim.claimType"
        name="claimType"
        (change)="onClaimTypeChange()">
        <option value="">
          Select claim type...
        </option>
        <option *ngFor="let t
          of availableTypes"
          [value]="t.value">
          {{ t.label }}
        </option>
      </select>
    </div>

    <div class="dynamic-questions"
      *ngIf="getQuestions().length > 0">
      <div class="form-group"
        *ngFor="let q of getQuestions();
          let i = index">
        <label class="form-label">
          {{ q }}
        </label>
        <input type="text"
          class="form-control"
          [(ngModel)]="dynamicAnswers[i]"
          [name]="'question_' + i"
          placeholder="Your answer...">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group half">
        <label class="form-label">
          INCIDENT DATE
        </label>
        <input type="date"
          class="form-control"
          [(ngModel)]="claim.incidentDate"
          name="incidentDate">
      </div>
      <div class="form-group half">
        <label class="form-label">
          ESTIMATED LOSS ($)
        </label>
        <input type="number"
          class="form-control"
          [(ngModel)]="claim.estimatedLoss"
          name="estimatedLoss"
          min="0" step="0.01"
          placeholder="0.00">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        INCIDENT LOCATION
      </label>
      <input type="text"
        class="form-control"
        [(ngModel)]="claim.incidentLocation"
        name="incidentLocation"
        placeholder="City, address...">
    </div>

    <div class="form-group">
      <label class="form-label">
        DESCRIPTION
      </label>
      <textarea class="form-control"
        rows="4"
        [(ngModel)]="claim.description"
        name="description"
        placeholder="Describe the incident...">
      </textarea>
    </div>

    <div class="form-group">
      <label class="form-label">
        SUPPORTING DOCUMENTS
      </label>
      <div class="doc-input-row">
        <input type="text"
          class="form-control"
          [(ngModel)]="documentInput"
          name="documentInput"
          placeholder="Document filename..."
          (keyup.enter)="addDocument()">
        <button type="button"
          class="btn-outline"
          (click)="addDocument()">
          ADD
        </button>
      </div>
      <div class="doc-list"
        *ngIf="claim.documents.length > 0">
        <span class="doc-tag"
          *ngFor="let d
            of claim.documents;
            let i = index">
          {{ d }}
          <span class="remove"
            (click)="removeDocument(i)">
            &times;
          </span>
        </span>
      </div>
      <div class="doc-hint"
        *ngIf="policy?.requiredDocuments">
        Required:
        {{ policy.requiredDocuments
          .join(', ') }}
      </div>
    </div>

    <div class="form-actions">
      <button type="button"
        class="btn-outline"
        routerLink="/policies">
        CANCEL
      </button>
      <button type="submit"
        class="btn-primary"
        [disabled]="submitting">
        {{ submitting
          ? 'SUBMITTING...'
          : 'SUBMIT CLAIM' }}
      </button>
    </div>
  </form>
</div>

<div class="loading" *ngIf="loading">
  Loading policy details...
</div>
